<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- Background: opaque white base layer -->
  <path fill="#FFFFFF" d="M0,0h108v108h-108z"/>

  <!--
    The mark is authored on its original 22..86 grid, which is 59% of the tile.

    It is scaled 1.24 about the centre, to 73%, because Chrome does not display
    a maskable icon at 1:1: it crops to roughly the central 80% of the canvas
    and scales that to fill the icon slot, magnifying the artwork by 1.25.

    The scale was fitted against a side-by-side screenshot of the installed
    Portfolio icon next to alex-store-app's, measuring the artwork's bounding
    box against the tile width in each:

      ours, bitmap 66%   -> predicted 83% displayed, measured 81%
      alex-store's icon  -> 91% displayed

    So 73% in the bitmap, landing at 91% displayed with a border of about 4%
    a side, which is what the reference icon shows.

    alex-store-app gets this without compensating: it is a native app with a
    two-layer adaptive icon, so the system owns the crop. A web manifest has no
    background/foreground split and no such control, so the crop is undone here
    instead.

    Both the "any" and the maskable variant are emitted at this same geometry,
    since which one a launcher picks is not ours to decide. The paths below are
    unchanged.
  -->
  <g transform="translate(54,54) scale(1.24) translate(-54,-54)">

    <!-- Top-left -->
    <path fill="#aa441e" d="M28,22h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

    <!-- Top-right -->
    <path fill="#aa441e" d="M61,22h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

    <!-- Bottom-left -->
    <path fill="#aa441e" d="M28,55h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

    <!-- Bottom-right -->
    <path fill="#aa441e" d="M61,55h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

    <!-- Centred monogram: letter O (geometric, 44 tall x 42 wide, same stroke weight as the D) -->
    <ellipse cx="54" cy="54" rx="17.04" ry="18.04" fill="none" stroke="#FFFFFF" stroke-width="7.92"/>
  </g>
</svg>