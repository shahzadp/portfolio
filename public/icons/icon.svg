<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- Background: opaque white base layer -->
  <path fill="#FFFFFF" d="M0,0h108v108h-108z"/>

  <!--
    The mark is authored on its original 22..86 grid, which leaves it at 59% of
    the tile and reads as a small icon next to launcher icons that fill theirs.
    It is scaled 1.45 about the centre, to 86%, leaving a border of roughly 7
    units on each side. The paths themselves are unchanged.

    Both the "any" and the maskable variant are emitted at this same geometry.
    An earlier build scaled the artwork up but additionally shrank the maskable
    icon to 0.64, so a launcher that picked the maskable one still rendered at
    about 55% of the tile and the enlargement appeared to have done nothing.
    The two have to stay identical, because which one a launcher picks is not
    ours to decide.

    That 7 unit margin is also what keeps the four blocks whole under a
    circular mask: at 1:1 the artwork's outer corner sits 68.7 units from the
    centre against a 54 unit radius, so filling the tile outright would shave
    the corners off.
  -->
  <g transform="translate(54,54) scale(1.45) translate(-54,-54)">

    <!-- Top-left -->
    <path fill="#aa441e" d="M28,22h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

    <!-- Top-right -->
    <path fill="#aa441e" d="M61,22h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

    <!-- Bottom-left -->
    <path fill="#aa441e" d="M28,55h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

    <!-- Bottom-right -->
    <path fill="#aa441e" d="M61,55h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

    <!-- Centred monogram: letter O (geometric, 44 tall x 42 wide, same stroke weight as the D) -->
    <ellipse cx="54" cy="54" rx="17.04" ry="18.04" fill="none" stroke="#FFFFFF" stroke-width="7.92"/>
  </g>
</svg>