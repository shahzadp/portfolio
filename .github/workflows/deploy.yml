name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a release halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate content from SQLite
        run: npm run db:generate

      - name: Build static site
        env:
          # Repo named <user>.github.io  -> served from the domain root, leave empty.
          # Any other repo name          -> set to that name, e.g. /sikander
          BASE_PATH: ${{ vars.BASE_PATH || '' }}
        run: npm run build

      - name: Verify the build output
        run: |
          test -f out/index.html
          test -f out/resume.pdf
          test -f out/portrait.jpg

      - uses: actions/configure-pages@v5
        id: pages

      # Next writes to out/ regardless of basePath: the prefix only rewrites
      # URLs inside the HTML, it does not nest the directory.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4